<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>雙位數認讀樂園</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-wrapper">
    <!-- 頂部導航 -->
    <header class="top-nav">
      <h1 class="app-title">🔢 雙位數認讀樂園</h1>
      <div class="diff-switch">
        <button id="btn-easy" class="mode-btn active" type="button">初階 (色彩與圖像)</button>
        <button id="btn-hard" class="mode-btn" type="button">進階 (純數字)</button>
      </div>
    </header>

    <!-- 第一頁：百格圖（置上方中央，純手指滑動滾動） -->
    <section id="view-grid" class="view-panel active">
      <div class="view-toolbar">
        <span class="view-hint">👆 用手指上下滑動百格圖（每次顯示 3 行）</span>
        <button id="btn-to-quiz" class="action-btn link-btn" type="button">挑戰認讀 ➔</button>
      </div>

      <div class="scroll-window-container">
        <!-- 百格圖本體（已移除上下箭咀按鈕） -->
        <div id="hundred-board" class="hundred-board"></div>
      </div>
    </section>

    <!-- 第二頁：認讀挑戰 -->
    <section id="view-quiz" class="view-panel">
      <div class="view-toolbar">
        <button id="btn-to-grid" class="action-btn back-btn" type="button">⬅ 返回百格圖</button>
        <span class="quiz-counter">第 <span id="quiz-num">1</span> / 10 題</span>
      </div>
      <div class="quiz-stage">
        <p class="quiz-instruction">請大聲讀出這個數字：</p>
        
        <div id="quiz-number-box" class="quiz-big-card">
          <span id="quiz-t" class="num-tens">0</span><span id="quiz-o" class="num-ones">0</span>
        </div>

        <div class="quiz-control-area">
          <button id="btn-next-question" class="single-next-btn" type="button">下一題 ➔</button>
        </div>
      </div>
    </section>

    <!-- 積木放大彈窗 -->
    <div id="inspect-modal" class="modal-layer">
      <div class="inspect-box">
        <button id="btn-close-inspect" class="modal-close-btn" type="button" aria-label="關閉">×</button>
        
        <div class="inspect-big-digits">
          <span id="inspect-t" class="num-tens">0</span><span id="inspect-o" class="num-ones">0</span>
        </div>

        <div class="manipulatives-container">
          <div id="block-tens" class="cpa-block block-tens">
            <div class="cpa-label">十位：<span id="val-tens-txt">0</span> 個十</div>
            <div id="tens-rods-canvas" class="rods-grid"></div>
            <div class="cpa-sub-label">（1 條有 10 粒）</div>
          </div>

          <div id="block-ones" class="cpa-block block-ones">
            <div class="cpa-label">個位：<span id="val-ones-txt">0</span> 個一</div>
            <div id="ones-cubes-canvas" class="cubes-grid-5"></div>
            <div class="cpa-sub-label">（5 粒一行，滿行才換行）</div>
          </div>
        </div>

        <p id="inspect-status-text" class="inspect-guide">請小朋友大聲讀出來！</p>
        <button id="btn-replay-anim" class="inspect-action-btn" type="button">✨ 重新展示</button>
      </div>
    </div>

    <!-- 恭喜完成彈窗 -->
    <div id="finish-modal" class="modal-layer">
      <div class="finish-box">
        <div class="finish-badge">🏆</div>
        <h2 class="finish-title">恭喜完成挑戰！</h2>
        <p class="finish-desc">你成功完成了 10 題雙位數認讀！表現非常出色！🌟</p>
        <button id="btn-restart-game" class="single-next-btn" type="button">🔄 再玩一次</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
